name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test release guards
        run: python3 -m unittest discover -s build/tests -v
      - name: Use only published dependencies for SDK and package restoration
        run: |
          cp build/NuGet.CI.Config NuGet.Config
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"
      - run: dotnet restore CodingRules.slnx --configfile build/NuGet.CI.Config
      - run: dotnet build CodingRules.slnx -c Release --no-restore
      - name: Run complete test suite, including packaged code fixes
        run: dotnet test CodingRules.slnx -c Release --no-build --no-restore
      - name: Pack the release candidate
        run: >-
          dotnet pack Package/CodingRules.Package.csproj -c Release --no-restore
          -p:ContinuousIntegrationBuild=true -p:RepositoryCommit=${{ github.sha }}
          --output artifacts/release
      - name: Test the exact package and record provenance
        run: python3 build/package_artifact.py artifacts/release
      - name: Verify packaged formatting diagnostics and fixes in a clean consumer
        run: python3 build/verify-formatting-consumer.py artifacts/release
      - name: Verify packaged tuple data findings and accepted cases in a clean consumer
        run: python3 build/verify-tuple-consumer.py artifacts/release
      - name: Verify packaged owned-contract findings and accepted signatures in a clean consumer
        run: python3 build/verify-contract-consumer.py artifacts/release
      - name: Verify decision-value extraction consumer
        run: python3 build/verify-decision-value-consumer.py artifacts/release
      - name: Verify packaged overload configuration findings and accepted families in a clean consumer
        run: python3 build/verify-overload-consumer.py artifacts/release
      - name: Verify packaged compound guards and status filters in a clean consumer
        run: python3 build/verify-condition-consumer.py artifacts/release
      - name: Verify packaged computed arguments and service lookup fixes in a clean consumer
        run: python3 build/verify-computation-consumer.py artifacts/release
      - name: Verify policy refinements consumer
        run: python3 build/verify-policy-refinements-consumer.py artifacts/release
      - name: Verify packaged compound predicates and compact nesting policy
        run: python3 build/verify-predicate-consumer.py artifacts/release
      - name: Retain tested main package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codingrules-package-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 90
